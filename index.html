<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recettes</title>
<meta name="description" content="Mes recettes, à suivre étape par étape.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/">🍕 <span>Recettes</span></a>
    <div class="spacer"></div>
    <a class="icon-btn" href="ajouter.html" style="text-decoration:none">＋ Ajouter</a>
    <button class="icon-btn" id="themeBtn" title="Changer le thème" aria-label="Changer le thème">◐</button>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer class="wrap">Les cases cochées sont gardées dans ce navigateur.</footer>
<div class="toast" id="toast"></div>

<script src="recettes.js"></script>
<script src="outils.js"></script>
<script>
(() => {
  const O = window.OUTILS;
  const R = (window.RECETTES || []).slice();
  /* Recettes ajoutées depuis ce navigateur, pas encore publiées par GitHub Pages */
  (() => {
    const att = O.store.get("recettes:attente", []);
    const reste = att.filter(p => !R.some(r => r.id === p.id));
    reste.forEach(p => R.push(Object.assign({}, p, { enAttente: true })));
    if (reste.length !== att.length) O.store.set("recettes:attente", reste);
  })();
  const app = document.getElementById("app");
  const $ = (s, el = document) => el.querySelector(s);
  const esc = O.esc, norm = O.norm, store = O.store;

  const progKey = id => "recettes:prog:" + id;
  const getProg = id => store.get(progKey(id), { ing: [], steps: [], portions: null });

  /* ---------- Thème ---------- */
  const themeBtn = document.getElementById("themeBtn");
  const applyTheme = t => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
  applyTheme(store.get("recettes:theme", null));
  themeBtn.onclick = () => {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    const t = dark ? "light" : "dark";
    applyTheme(t); store.set("recettes:theme", t);
  };

  /* ---------- Formatage des quantités ---------- */
  const UNITES = {
    g: ["g", "g"], kg: ["kg", "kg"], ml: ["ml", "ml"], l: ["L", "L"],
    c_the: ["c. à thé", "c. à thé"], c_soupe: ["c. à soupe", "c. à soupe"],
    tasse: ["tasse", "tasses"], pincee: ["pincée", "pincées"], oz: ["oz", "oz"], lb: ["lb", "lb"], "": ["", ""]
  };
  const FRACS = [[0, ""], [1/8, "⅛"], [1/4, "¼"], [1/3, "⅓"], [1/2, "½"], [2/3, "⅔"], [3/4, "¾"], [1, ""]];
  function frac(x) {
    let ent = Math.floor(x), r = x - ent, best = FRACS[0], bd = 9;
    for (const f of FRACS) { const d = Math.abs(r - f[0]); if (d < bd) { bd = d; best = f; } }
    if (best[0] === 1) { ent += 1; best = FRACS[0]; }
    if (!ent && !best[1]) return "une pointe";
    return (ent ? ent + (best[1] ? " " : "") : "") + best[1];
  }
  function fmtQty(q, unite) {
    const u = UNITES[unite] ?? [unite, unite];
    if (["c_the", "c_soupe", "tasse", "pincee", ""].includes(unite)) {
      const s = frac(q);
      return (s + " " + (q > 1 ? u[1] : u[0])).trim();
    }
    let v = q;
    const dec = v >= 100 ? 0 : v >= 10 ? 0 : 1;
    let s = (Math.round(v * 10 ** dec) / 10 ** dec).toLocaleString("fr-CA");
    return s + " " + u[0];
  }
  const fmtTime = s => {
    s = Math.max(0, Math.round(s));
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
    return h ? `${h} h ${String(m).padStart(2, "0")}` : `${m}:${String(ss).padStart(2, "0")}`;
  };
  const fmtDur = s => {
    const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60);
    if (h >= 24 && !m && h % 24 === 0) return `${h} h`;
    return h ? (m ? `${h} h ${m}` : `${h} h`) : `${m} min`;
  };

  /* ---------- Menu de la semaine ----------
     Une semaine va du dimanche 18 h au dimanche 18 h suivant. Au premier chargement
     d'une nouvelle semaine, le menu en cours est archivé dans l'historique puis vidé. */
  const RESET_H = 18;
  const dateKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  function debutSemaine(now = new Date()) {
    const d = new Date(now); d.setHours(RESET_H, 0, 0, 0);
    d.setDate(d.getDate() - d.getDay());
    if (d > now) d.setDate(d.getDate() - 7);
    return dateKey(d); // le dimanche où la semaine commence
  }
  function libelleSemaine(cle) {
    const [y, m, j] = cle.split("-").map(Number);
    const lun = new Date(y, m - 1, j + 1), dim = new Date(y, m - 1, j + 7);
    const f = (d, an) => (d.getDate() === 1 ? "1er" : d.getDate()) + " " +
      d.toLocaleDateString("fr-CA", { month: "long" }) + (an ? " " + d.getFullYear() : "");
    return `Semaine du ${f(lun)} au ${f(dim, true)}`;
  }
  const menu = (() => {
    const cle = debutSemaine();
    let m = store.get("recettes:menu", null);
    if (!m || m.semaine !== cle) {
      if (m && m.ids && m.ids.length) {
        const hist = store.get("recettes:menus", []).filter(h => h.semaine !== m.semaine);
        hist.unshift({ semaine: m.semaine, ids: m.ids });
        store.set("recettes:menus", hist.slice(0, 104));
      }
      m = { semaine: cle, ids: [] };
      store.set("recettes:menu", m);
    }
    return m;
  })();
  const auMenu = id => menu.ids.includes(id);
  function basculerMenu(id) {
    const i = menu.ids.indexOf(id);
    i < 0 ? menu.ids.push(id) : menu.ids.splice(i, 1);
    store.set("recettes:menu", menu);
    toast(i < 0 ? "Ajoutée au menu de la semaine" : "Retirée du menu de la semaine");
    return i < 0;
  }
  const btnMenu = id => `<button class="menu-btn" data-menu="${esc(id)}" aria-pressed="${auMenu(id)}" title="${auMenu(id) ? "Retirer du menu de la semaine" : "Ajouter au menu de la semaine"}" aria-label="Au menu cette semaine">${auMenu(id) ? "★" : "☆"}</button>`;

  /* ---------- Toast ---------- */
  let toastT;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200);
  }

  /* ---------- Liste ---------- */
  const listState = store.get("recettes:liste", { q: "", cat: "", tags: [], tri: "titre" });
  const saveList = () => store.set("recettes:liste", listState);

  function renderList() {
    document.title = "Recettes";
    const cats = [...new Set(R.map(r => r.categorie))].sort((a, b) => a.localeCompare(b, "fr"));
    const tags = [...new Set(R.flatMap(r => r.etiquettes || []))].sort((a, b) => a.localeCompare(b, "fr"));
    app.innerHTML = `
      <section class="hero">
        <h1>Mes recettes</h1>
        <p>Choisissez une recette, puis cochez les ingrédients et les étapes au fur et à mesure.</p>
      </section>
      <section class="menu-sem">
        <div class="menu-head">
          <h2>★ Au menu cette semaine</h2>
          <a href="#/menus">Semaines précédentes →</a>
        </div>
        <div id="menuGrid"></div>
      </section>
      <h2 class="all-title">Toutes les recettes</h2>
      <div class="tools">
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Chercher une recette ou un ingrédient" value="${esc(listState.q)}" aria-label="Chercher">
        </label>
        <select id="tri" aria-label="Trier">
          <option value="titre">Trier : nom (A → Z)</option>
          <option value="categorie">Trier : type</option>
          <option value="recent">Trier : plus récentes</option>
          <option value="rapide">Trier : plus rapides</option>
        </select>
      </div>
      <div class="filter-label">Type</div>
      <div class="chips" id="cats">
        <button class="chip" data-cat="" aria-pressed="${!listState.cat}">Toutes</button>
        ${cats.map(c => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${listState.cat === c}">${esc(c)}</button>`).join("")}
      </div>
      ${tags.length ? `<div class="filter-label">Étiquettes</div>
      <div class="chips" id="tags">
        ${tags.map(t => `<button class="chip" data-tag="${esc(t)}" aria-pressed="${listState.tags.includes(t)}">${esc(t)}</button>`).join("")}
      </div>` : ""}
      <div class="count" id="count"></div>
      <div class="grid" id="grid"></div>`;
    $("#tri").value = listState.tri;
    $("#q").oninput = e => { listState.q = e.target.value; saveList(); drawGrid(); };
    $("#tri").onchange = e => { listState.tri = e.target.value; saveList(); drawGrid(); };
    $("#cats").onclick = e => {
      const b = e.target.closest("[data-cat]"); if (!b) return;
      listState.cat = b.dataset.cat; saveList();
      $("#cats").querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.cat === listState.cat));
      drawGrid();
    };
    const tg = $("#tags");
    if (tg) tg.onclick = e => {
      const b = e.target.closest("[data-tag]"); if (!b) return;
      const t = b.dataset.tag, i = listState.tags.indexOf(t);
      i < 0 ? listState.tags.push(t) : listState.tags.splice(i, 1);
      b.setAttribute("aria-pressed", i < 0); saveList(); drawGrid();
    };
    app.onclick = e => {
      const b = e.target.closest("[data-menu]"); if (!b) return;
      e.preventDefault(); e.stopPropagation();
      basculerMenu(b.dataset.menu); drawGrid();
    };
    drawGrid();
  }

  function carte(r) {
    const p = getProg(r.id);
    const n = p.ing.length + p.steps.length, tot = r.ingredients.length + r.etapes.length;
    return `<a class="card" href="#/recette/${encodeURIComponent(r.id)}">
      ${btnMenu(r.id)}
      ${r.image ? `<img class="thumb" src="${esc(r.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
      <div class="cat">${esc(r.categorie)}</div>
      <h2>${esc(r.titre)}</h2>
      <p>${esc(r.description)}</p>
      <div class="tags">${(r.etiquettes || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}
        ${n ? `<span class="progress-pill">En cours · ${n}/${tot}</span>` : ""}
        ${r.enAttente ? `<span class="tag">Publication en cours…</span>` : ""}</div>
      <div class="meta">
        ${r.tempsTotal ? `<span>⏱ ${esc(r.tempsTotal)}</span>` : ""}
        <span>🍽 ${r.portions} ${esc(r.unitePortion || "portions")}</span>
      </div>
    </a>`;
  }

  const totalSec = r => (r.etapes || []).reduce((a, e) => a + (e.minuterie || 0), 0);

  function drawGrid() {
    const q = norm(listState.q.trim());
    const duMenu = menu.ids.map(id => R.find(r => r.id === id)).filter(Boolean);
    $("#menuGrid").innerHTML = duMenu.length
      ? `<div class="grid">${duMenu.map(carte).join("")}</div>`
      : `<p class="menu-vide">Rien pour l'instant. Touchez ☆ sur une recette pour la mettre au menu.</p>`;
    let list = R.filter(r => !auMenu(r.id) &&
      (!listState.cat || r.categorie === listState.cat) &&
      listState.tags.every(t => (r.etiquettes || []).includes(t)) &&
      (!q || norm([r.titre, r.description, r.categorie, ...(r.etiquettes || []), ...r.ingredients.map(i => i.nom), ...(r.composer || []).flatMap(g => g.options.map(o => o.nom))].join(" ")).includes(q))
    );
    const by = {
      titre: (a, b) => a.titre.localeCompare(b.titre, "fr"),
      categorie: (a, b) => a.categorie.localeCompare(b.categorie, "fr") || a.titre.localeCompare(b.titre, "fr"),
      recent: (a, b) => (b.ajoutee || "").localeCompare(a.ajoutee || ""),
      rapide: (a, b) => totalSec(a) - totalSec(b)
    };
    list.sort(by[listState.tri] || by.titre);
    $("#count").textContent = list.length + (list.length > 1 ? " recettes" : " recette");
    $("#grid").innerHTML = list.length ? list.map(carte).join("") : `<div class="empty">Aucune recette ne correspond.</div>`;
  }

  /* ---------- Semaines précédentes ---------- */
  function renderMenus() {
    document.title = "Menus précédents · Recettes";
    const hist = store.get("recettes:menus", []);
    app.innerHTML = `
      <a class="back" href="#/">← Toutes les recettes</a>
      <section class="hero"><h1>Semaines précédentes</h1>
        <p>Le menu repart à zéro chaque dimanche à ${RESET_H} h. Touchez ☆ pour remettre une recette au menu de cette semaine.</p></section>
      ${hist.length ? hist.map(h => {
        const rs = h.ids.map(id => R.find(r => r.id === id)).filter(Boolean);
        return `<section class="panel hist">
          <h2>${esc(libelleSemaine(h.semaine))}</h2>
          <ul class="hist-list">${rs.length ? rs.map(r => `<li>${btnMenu(r.id)}
            <a href="#/recette/${encodeURIComponent(r.id)}">${esc(r.titre)}</a>
            <span class="cat-mini">${esc(r.categorie)}</span></li>`).join("") : `<li class="menu-vide">Recettes retirées du site.</li>`}</ul>
        </section>`;
      }).join("") : `<p class="empty">Aucune semaine archivée pour l'instant.</p>`}`;
    app.onclick = e => {
      const b = e.target.closest("[data-menu]"); if (!b) return;
      e.preventDefault();
      basculerMenu(b.dataset.menu); renderMenus();
    };
  }

  /* ---------- Recette ---------- */
  const timers = {}; // index -> {end, remaining, iv}
  let wakeLock = null;

  function renderRecipe(id) {
    const r = R.find(x => x.id === id);
    if (!r) { app.innerHTML = `<a class="back" href="#/">← Toutes les recettes</a><p class="empty">Recette introuvable.</p>`; return; }
    document.title = r.titre + " · Recettes";
    const prog = getProg(r.id);
    let portions = prog.portions || r.portions;
    const save = () => store.set(progKey(r.id), prog);

    app.innerHTML = `
      <a class="back" href="#/">← Toutes les recettes</a>
      <section class="r-head">
        <div class="cat">${esc(r.categorie)}</div>
        <h1>${esc(r.titre)}</h1>
        ${r.description ? `<p>${esc(r.description)}</p>` : ""}
        <div class="tags">${(r.etiquettes || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
        ${r.source ? `<p class="source">Source : <a href="${esc(r.source)}" target="_blank" rel="noopener">${esc(new URL(r.source).hostname.replace(/^www\./, ""))}</a></p>` : ""}
        <div class="facts">
          ${r.tempsActif ? `<div class="fact"><small>Temps actif</small><b>${esc(r.tempsActif)}</b></div>` : ""}
          ${r.tempsTotal ? `<div class="fact"><small>Temps total</small><b>${esc(r.tempsTotal)}</b></div>` : ""}
          <div class="fact"><small>Rendement</small><b>${r.portions} ${esc(r.unitePortion || "portions")}</b></div>
        </div>
      </section>
      <div class="r-actions">
        <div class="servings" title="Ajuster les quantités">
          <button id="minus" aria-label="Moins">−</button>
          <span id="portLbl"></span>
          <button id="plus" aria-label="Plus">+</button>
        </div>
        <button class="icon-btn" id="menuBtn" aria-pressed="${auMenu(r.id)}">${auMenu(r.id) ? "★ Au menu cette semaine" : "☆ Ajouter au menu"}</button>
        <button class="icon-btn" id="wake" aria-pressed="false" title="Empêche l'écran de s'éteindre pendant que vous cuisinez">☀ Garder l'écran allumé</button>
        <button class="icon-btn" id="reset">↺ Tout décocher</button>
      </div>
      <div class="layout">
        ${r.composer ? `<section class="panel full compose">
          <div class="panel-head"><h2>Je compose</h2><small>Touchez ce que vous utilisez</small></div>
          <div id="compose"></div>
        </section>` : ""}
        <section class="panel ing">
          <div class="panel-head"><h2>Ingrédients</h2><small id="ingCount"></small></div>
          <div class="bar"><i id="ingBar"></i></div>
          <ul class="checks" id="ingList"></ul>
        </section>
        <section class="panel">
          <div class="panel-head"><h2>Étapes</h2><small id="stepCount"></small></div>
          <div class="bar"><i id="stepBar"></i></div>
          <ol class="steps" id="stepList"></ol>
        </section>
        ${r.astuces && r.astuces.length ? `<section class="panel full">
          <h2>Astuces</h2>
          <ul class="tips">${r.astuces.map(a => `<li>${esc(a)}</li>`).join("")}</ul>
        </section>` : ""}
      </div>`;

    /* Composeur : options cochées → ingrédients. Mode « partage » : la quantité du groupe
       est répartie également entre les options choisies ; sinon chaque option a sa quantité. */
    const groupes = r.composer || [];
    const defauts = () => groupes.flatMap((g, gi) => g.options.flatMap((o, oi) => o.defaut ? [gi + "-" + oi] : []));
    const choix = () => prog.choix || defauts();
    const tasses = ml => { const t = ml / 250; return t >= 1 / 16 ? "≈ " + frac(t) + (t > 1.1 ? " tasses" : " tasse") : ""; };
    function composes(k) {
      const sel = choix(), out = [];
      groupes.forEach((g, gi) => {
        const on = g.options.map((_, oi) => oi).filter(oi => sel.includes(gi + "-" + oi));
        on.forEach(oi => {
          const o = g.options[oi], key = "c" + gi + "-" + oi;
          if (g.mode === "partage") {
            const q = g.quantite / on.length * k;
            out.push({ key, nom: o.nom, quantite: q, unite: g.unite, note: o.note, eq: g.unite === "ml" ? tasses(q) : "" });
          } else out.push({ key, ...o, quantite: o.quantite && o.quantite * k, eq: k === 1 ? o.equivalent : "" });
        });
      });
      return out;
    }
    function drawCompose() {
      const el = $("#compose"); if (!el) return;
      const sel = choix(), k = portions / r.portions;
      el.innerHTML = groupes.map((g, gi) => {
        const n = g.options.filter((_, oi) => sel.includes(gi + "-" + oi)).length;
        const info = g.mode === "partage"
          ? ` · ${fmtQty(g.quantite * k, g.unite)} au total${g.unite === "ml" ? " (" + tasses(g.quantite * k) + ")" : ""}, réparti entre vos choix`
          : "";
        return `<div class="filter-label">${esc(g.titre)}${esc(info)}</div>
          <div class="chips">${g.options.map((o, oi) => `<button class="chip" data-c="${gi}-${oi}" aria-pressed="${sel.includes(gi + "-" + oi)}">${esc(o.nom)}</button>`).join("")}</div>
          ${g.mode === "partage" && !n ? `<p class="note">Choisissez au moins une option.</p>` : ""}`;
      }).join("");
    }

    function drawIng() {
      const k = portions / r.portions;
      $("#portLbl").textContent = `${portions} ${r.unitePortion || "portions"}`;
      const items = r.ingredients.map((g, i) => ({ key: i, ...g, quantite: g.quantite && g.quantite * k, eq: k === 1 ? g.equivalent : "" })).concat(composes(k));
      $("#ingList").innerHTML = items.map(g => {
        const on = prog.ing.includes(g.key);
        return `<li class="${on ? "done" : ""}"><label class="check">
          <input type="checkbox" data-i="${g.key}" ${on ? "checked" : ""}>
          <span class="txt">${g.quantite ? `<span class="qty">${esc(fmtQty(g.quantite, g.unite))}</span> ` : ""}<span class="name">${esc(g.nom)}</span>
          ${g.note ? `<span class="note">${esc(g.note)}</span>` : ""}
          ${g.eq ? `<span class="eq">${esc(g.eq)}</span>` : ""}</span>
        </label></li>`;
      }).join("");
      const keys = items.map(g => g.key);
      prog.ing = prog.ing.filter(x => keys.includes(x));
      const n = prog.ing.length, t = items.length;
      $("#ingCount").textContent = `${n}/${t}`;
      $("#ingBar").style.width = (100 * n / t) + "%";
    }

    function drawSteps() {
      const cur = r.etapes.findIndex((_, i) => !prog.steps.includes(i));
      $("#stepList").innerHTML = r.etapes.map((s, i) => {
        const on = prog.steps.includes(i);
        return `<li class="step ${on ? "done" : ""} ${i === cur ? "current" : ""}" id="step-${i}">
          <div class="num">${on ? "✓" : i + 1}</div>
          <div class="step-body">
            <div class="step-top"><label class="check">
              <input type="checkbox" data-s="${i}" ${on ? "checked" : ""} aria-label="Étape ${i + 1} terminée">
              <span>${s.titre ? `<h3>${esc(s.titre)}</h3>` : ""}<p${s.titre ? "" : ' class="solo"'}>${esc(s.texte)}</p></span>
            </label></div>
            ${s.minuterie ? `<div class="timer" id="tm-${i}"><span class="t"></span><button data-t="${i}"></button><button data-tr="${i}" title="Réinitialiser">↺</button></div>` : ""}
          </div>
        </li>`;
      }).join("");
      r.etapes.forEach((s, i) => s.minuterie && drawTimer(i));
      const n = prog.steps.length, t = r.etapes.length;
      $("#stepCount").textContent = `${n}/${t}`;
      $("#stepBar").style.width = (100 * n / t) + "%";
    }

    function drawTimer(i) {
      const el = document.getElementById("tm-" + i); if (!el) return;
      const tm = timers[r.id + i], dur = r.etapes[i].minuterie;
      let rem = dur, state = "idle";
      if (tm) { rem = tm.end ? (tm.end - Date.now()) / 1000 : tm.remaining; state = tm.end ? "running" : "paused"; }
      const fin = rem <= 0 && state !== "idle";
      el.className = "timer" + (fin ? " finished" : state === "running" ? " running" : "");
      $(".t", el).textContent = fin ? "Terminé !" : (state === "idle" ? "⏲ " + fmtDur(dur) : "⏲ " + fmtTime(rem));
      $("[data-t]", el).textContent = fin ? "OK" : state === "running" ? "Pause" : state === "paused" ? "Reprendre" : "Démarrer";
      $("[data-tr]", el).style.display = state === "idle" ? "none" : "";
    }

    $("#ingList").onchange = e => {
      const d = e.target.dataset.i; if (d === undefined) return;
      const i = /^\d+$/.test(d) ? +d : d;
      e.target.checked ? prog.ing.push(i) : prog.ing.splice(prog.ing.indexOf(i), 1);
      save(); drawIng();
    };
    $("#stepList").onchange = e => {
      const i = +e.target.dataset.s; if (isNaN(i)) return;
      e.target.checked ? prog.steps.push(i) : prog.steps.splice(prog.steps.indexOf(i), 1);
      save(); drawSteps();
      if (e.target.checked && prog.steps.length === r.etapes.length) toast("Bon appétit !");
      else if (e.target.checked) { const nx = document.querySelector(".step.current"); nx && nx.scrollIntoView({ behavior: "smooth", block: "center" }); }
    };
    $("#stepList").onclick = e => {
      const b = e.target.closest("[data-t],[data-tr]"); if (!b) return;
      e.preventDefault();
      const i = +(b.dataset.t ?? b.dataset.tr), key = r.id + i, dur = r.etapes[i].minuterie;
      let tm = timers[key];
      if (b.dataset.tr !== undefined) { delete timers[key]; drawTimer(i); return; }
      if (!tm) { timers[key] = { end: Date.now() + dur * 1000 }; askNotif(); }
      else if (tm.end) {
        const rem = (tm.end - Date.now()) / 1000;
        if (rem <= 0) delete timers[key];
        else timers[key] = { remaining: rem };
      } else timers[key] = { end: Date.now() + tm.remaining * 1000 };
      drawTimer(i);
    };

    const cmp = $("#compose");
    if (cmp) cmp.onclick = e => {
      const b = e.target.closest("[data-c]"); if (!b) return;
      const sel = choix().slice(), c = b.dataset.c, j = sel.indexOf(c);
      j < 0 ? sel.push(c) : sel.splice(j, 1);
      prog.choix = sel; drawCompose(); drawIng(); save();
    };
    $("#minus").onclick = () => { if (portions > 1) { portions--; prog.portions = portions; save(); drawIng(); drawCompose(); } };
    $("#plus").onclick = () => { portions++; prog.portions = portions; save(); drawIng(); drawCompose(); };
    $("#reset").onclick = () => {
      prog.ing = []; prog.steps = []; prog.portions = null; portions = r.portions;
      save(); drawIng(); drawCompose(); drawSteps(); toast("Recette remise à zéro");
    };
    app.onclick = null;
    $("#menuBtn").onclick = e => {
      const on = basculerMenu(r.id);
      e.currentTarget.setAttribute("aria-pressed", on);
      e.currentTarget.textContent = on ? "★ Au menu cette semaine" : "☆ Ajouter au menu";
    };
    const wakeBtn = $("#wake");
    if (!("wakeLock" in navigator)) wakeBtn.style.display = "none";
    wakeBtn.setAttribute("aria-pressed", !!wakeLock);
    wakeBtn.onclick = async () => {
      try {
        if (wakeLock) { await wakeLock.release(); wakeLock = null; }
        else { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; const b = $("#wake"); b && b.setAttribute("aria-pressed", "false"); }); }
        wakeBtn.setAttribute("aria-pressed", !!wakeLock);
      } catch { toast("Impossible de garder l'écran allumé ici"); }
    };

    drawCompose(); drawIng(); drawSteps();
    currentTick = () => r.etapes.forEach((s, i) => s.minuterie && drawTimer(i));
  }

  /* ---------- Minuteries globales ---------- */
  let currentTick = null;
  const notified = new Set();
  function askNotif() { try { if ("Notification" in window && Notification.permission === "default") Notification.requestPermission(); } catch {} }
  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, .35, .7].forEach(t => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(.2, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .3);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .3);
      });
    } catch {}
  }
  setInterval(() => {
    for (const [key, tm] of Object.entries(timers)) {
      if (tm.end && tm.end <= Date.now() && !notified.has(key + tm.end)) {
        notified.add(key + tm.end);
        const r = R.find(x => key.startsWith(x.id)); const i = r ? +key.slice(r.id.length) : 0;
        const label = r ? `${r.titre} : ${r.etapes[i].titre}` : "Minuterie";
        beep(); toast("⏲ " + label + " — terminé");
        try { if ("Notification" in window && Notification.permission === "granted") new Notification("Minuterie terminée", { body: label }); } catch {}
      }
    }
    currentTick && currentTick();
  }, 1000);

  /* ---------- Routeur ---------- */
  function route() {
    currentTick = null;
    const m = location.hash.match(/^#\/recette\/(.+)$/);
    if (m) renderRecipe(decodeURIComponent(m[1]));
    else if (location.hash === "#/menus") renderMenus();
    else renderList();
    window.scrollTo(0, 0);
  }
  addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
