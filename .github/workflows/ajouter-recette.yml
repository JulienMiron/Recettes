name: Ajouter une recette

# Une issue ouverte par le propriétaire du dépôt depuis la page Ajouter
# (corps contenant <!-- recette --> et un bloc ```json) est ajoutée à recettes.js.
on:
  issues:
    types: [opened]

concurrency:
  group: recettes
  cancel-in-progress: false

jobs:
  ajouter:
    if: github.event.issue.user.login == github.repository_owner && contains(github.event.issue.body, '<!-- recette -->')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      id: ${{ steps.ajout.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Ajouter la recette à recettes.js
        id: ajout
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node .github/scripts/ajouter-recette.js

      - name: Commit et push
        env:
          TITRE: ${{ steps.ajout.outputs.titre }}
          NUM: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recettes.js
          git commit -m "Ajouter la recette : $TITRE (#$NUM)"
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1

      - name: Fermer l'issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          ID: ${{ steps.ajout.outputs.id }}
        run: |
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "✅ Recette ajoutée. Elle sera en ligne dans une minute : https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/#/recette/$ID"
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"

      - name: Signaler l'erreur
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          ERR: ${{ steps.ajout.outputs.erreur }}
        run: |
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "❌ La recette n'a pas pu être ajoutée. ${ERR:-Voir le détail dans l'onglet Actions.} Corrigez le bloc JSON de l'issue, puis fermez-la et ouvrez-en une nouvelle."

  publier:
    needs: ajouter
    uses: ./.github/workflows/publier.yml
    permissions:
      contents: read
      pages: write
      id-token: write
